<style>
  :root{
    --paper:#F6F2EA; --paper-2:#EFE9DB; --paper-3:#E6DFCE;
    --ink:#211D18; --muted:#8B8377; --line:#DDD5C6;
    --accent:#2B4C7E; --it:#2B4C7E; --car:#A23E24; --food:#5C7A3D;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  .utilitybar{background:var(--ink);color:var(--paper);}
  .utilitybar-inner{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:38px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .utilitybar ul{list-style:none;display:flex;gap:18px;margin:0;padding:0;}
  .utilitybar a{opacity:.78;transition:opacity .15s;}
  .utilitybar a:hover{opacity:1;}
  .utilitybar .auth{display:flex;gap:14px;align-items:center;list-style:none;margin:0;padding:0;}
  .utilitybar .btn-manage{border:1px solid rgba(246,242,234,.35);padding:4px 10px;border-radius:2px;opacity:1;}
  .utilitybar .btn-manage:hover{background:var(--paper);color:var(--ink);border-color:var(--paper);}

  .site-header{max-width:1080px;margin:0 auto;padding:52px 24px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:40px;letter-spacing:-.5px;margin:0 0 8px;}
  .brand p{margin:0;color:var(--muted);font-size:14.5px;}
  .searchbox{display:flex;align-items:center;border:1px solid var(--line);background:var(--paper-2);border-radius:2px;padding:0 4px 0 12px;height:38px;min-width:230px;}
  .searchbox input{border:none;background:transparent;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);flex:1;padding:0 8px;}
  .searchbox input::placeholder{color:var(--muted);}
  .searchbox button{border:none;background:var(--ink);color:var(--paper);height:28px;width:32px;border-radius:2px;cursor:pointer;font-size:13px;}

  .catnav{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);list-style:none;}
  .catnav button{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;}
  .catnav button .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .catnav button .count{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .catnav button:hover{border-color:var(--ink);}
  .catnav button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .catnav button.active .count{color:var(--paper-3);}
  .catnav button.active .dot{background:var(--paper);}
  .catnav button[data-cat="IT"] .dot{background:var(--it);}
  .catnav button[data-cat="CAR"] .dot{background:var(--car);}
  .catnav button[data-cat="맛집"] .dot{background:var(--food);}
  .catnav button.active[data-cat] .dot{background:var(--paper);}

  .layout{max-width:1080px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:1fr 300px;gap:48px;}

  .postlist{display:flex;flex-direction:column;}
  .post{display:grid;grid-template-columns:88px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);}
  .post:first-child{padding-top:0;}
  .post-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);padding-top:4px;}
  .post-date .day{display:block;font-size:22px;color:var(--ink);line-height:1;margin-bottom:4px;}
  .post-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:2px;color:#fff;letter-spacing:.02em;}
  .chip.IT{background:var(--it);}
  .chip.CAR{background:var(--car);}
  .chip.맛집{background:var(--food);}
  .post-views{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}
  .post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag-chip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer;}
  .tag-chip:hover{border-color:var(--accent);color:var(--accent);}
  .tag-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .active-filter{display:flex;align-items:center;gap:8px;margin:0 0 18px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
  .active-filter button{border:none;background:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:inherit;text-decoration:underline;}
  .post h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0 0 8px;letter-spacing:-.2px;cursor:pointer;}
  .post h2:hover{color:var(--accent);}
  .post p{margin:0;font-size:14px;line-height:1.6;color:#4B463D;white-space:pre-wrap;}
  .post .markdown-body{white-space:normal;}
  .post .markdown-body p{margin:0 0 14px;white-space:normal;}
  .post .markdown-body h3,.post .markdown-body h4,.post .markdown-body h5{font-family:'Fraunces',serif;margin:20px 0 10px;}
  .post .markdown-body img,.post .markdown-body video{margin:14px 0;}
  .post .markdown-body a{color:var(--accent);text-decoration:underline;}
  .empty, .loading{padding:60px 0;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  .sidebar{display:flex;flex-direction:column;gap:28px;}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .card h2{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 14px;font-weight:600;}

  .profile{display:flex;gap:12px;align-items:center;}
  .profile .avatar{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;}
  .profile .name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0;}
  .profile .role{font-size:12.5px;color:var(--muted);margin:0;}

  .visit-stats{display:flex;gap:18px;margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}
  .visit-stats div b{display:block;font-size:19px;color:var(--ink);font-weight:600;}
  .visit-stats div span{font-size:10.5px;color:var(--muted);}
  .visit-bars{display:flex;align-items:flex-end;gap:10px;height:70px;}
  .visit-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .visit-bar{width:100%;background:var(--it);border-radius:3px 3px 0 0;min-height:4px;}
  .visit-bar-col .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink);}
  .visit-bar-col .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}

  .cat-stat-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:10px;}
  .cat-stat-row .label{width:44px;flex-shrink:0;font-weight:600;}
  .cat-stat-row .bar-bg{flex:1;height:6px;background:var(--paper-3);border-radius:4px;overflow:hidden;}
  .cat-stat-row .bar-fill{height:100%;border-radius:4px;}
  .cat-stat-row .num{width:24px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11px;}

  .manage-menu{display:flex;flex-direction:column;list-style:none;margin:0;padding:0;}
  .manage-menu li a{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .manage-menu li:last-child a{border-bottom:none;}
  .manage-menu li a:hover{color:var(--accent);}
  .manage-menu li a .arrow{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .site-footer{text-align:center;padding:28px 24px 40px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .site-header{flex-direction:column;align-items:flex-start;}
    .searchbox{width:100%;min-width:0;}
    .utilitybar-inner{font-size:11px;padding:0 16px;}
    .utilitybar ul{gap:12px;}
  }
</style>
</head>

<script>
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  let allPosts = [];
  let currentCat = "all";
  let currentTag = new URLSearchParams(location.search).get('tag') || null;

  const CAT_MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  async function loadPosts(){
    const { data, error } = await supabase
      .from('posts')
      .select('*')
      .order('created_at', { ascending:false });

    if(error){
      document.getElementById('postlist').innerHTML = `<p class="empty">글을 불러오지 못했습니다. supabase-config.js 설정을 확인해주세요.</p>`;
      console.error(error);
      return;
    }
    allPosts = data || [];
    updateCategoryCounts();
    renderPosts();
  }

  function updateCategoryCounts(){
    const it = allPosts.filter(p=>p.category==='IT').length;
    const car = allPosts.filter(p=>p.category==='CAR').length;
    const food = allPosts.filter(p=>p.category==='맛집').length;
    document.getElementById('countAll').textContent = `(${allPosts.length})`;
    document.getElementById('countIT').textContent = `(${it})`;
    document.getElementById('countCAR').textContent = `(${car})`;
    document.getElementById('count맛집').textContent = `(${food})`;

    const total = allPosts.length || 1;
    document.getElementById('barIT').style.width = (it/total*100)+'%';
    document.getElementById('barCAR').style.width = (car/total*100)+'%';
    document.getElementById('bar맛집').style.width = (food/total*100)+'%';
    document.getElementById('numIT').textContent = it;
    document.getElementById('numCAR').textContent = car;
    document.getElementById('num맛집').textContent = food;
  }

  function renderPosts(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('postlist');
    const filtered = allPosts.filter(p=>{
      const catOk = currentCat === 'all' || p.category === currentCat;
      const tagOk = !currentTag || (p.tags||[]).includes(currentTag);
      const qOk = !q || p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q);
      return catOk && tagOk && qOk;
    });

    renderActiveFilter();

    if(!filtered.length){
      list.innerHTML = `<p class="empty">해당하는 글이 없습니다.</p>`;
      return;
    }

    list.innerHTML = filtered.map(p=>{
      const d = new Date(p.created_at);
      const day = String(d.getDate()).padStart(2,'0');
      const month = CAT_MONTHS[d.getMonth()];
      const plain = stripMarkdown(p.content);
      const excerpt = plain.length > 90 ? plain.slice(0,90)+'…' : plain;
      const tags = p.tags||[];
      return `
        <article class="post" data-id="${p.id}">
          <div class="post-date"><span class="day">${day}</span>${month}</div>
          <div>
            <div class="post-meta">
              <span class="chip ${p.category}">${p.category}</span>
              <span class="post-views">조회 ${p.views}</span>
            </div>
            <h2 onclick="togglePost('${p.id}')">${escapeHtml(p.title)}</h2>
            <p class="excerpt" id="excerpt-${p.id}">${escapeHtml(excerpt)}</p>
            ${tags.length ? `<div class="post-tags">${tags.map(t=>`<span class="tag-chip${t===currentTag?' active':''}" onclick="setTag('${escapeHtml(t)}')">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          </div>
        </article>
      `;
    }).join('');
  }

  function renderActiveFilter(){
    const box = document.getElementById('activeFilter');
    if(!currentTag){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="active-filter">태그 <strong>#${escapeHtml(currentTag)}</strong> 필터링 중 <button onclick="setTag(null)">전체 보기</button></div>`;
  }

  function setTag(tag){
    currentTag = tag;
    const url = new URL(location.href);
    if(tag){ url.searchParams.set('tag', tag); } else { url.searchParams.delete('tag'); }
    history.replaceState(null, '', url);
    renderPosts();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function togglePost(id){
    const post = allPosts.find(p=>p.id===id);
    const el = document.getElementById('excerpt-'+id);
    const isExpanded = el.classList.contains('expanded');
    if(isExpanded){
      const plain = stripMarkdown(post.content);
      const excerpt = plain.length > 90 ? plain.slice(0,90)+'…' : plain;
      el.classList.remove('markdown-body');
      el.textContent = excerpt;
      el.classList.remove('expanded');
    } else {
      el.innerHTML = renderMarkdown(post.content);
      el.classList.add('markdown-body');
      el.classList.add('expanded');
      bumpViews(id);
    }
  }

  async function bumpViews(id){
    const post = allPosts.find(p=>p.id===id);
    if(!post || post._viewed) return;
    post._viewed = true;
    const newViews = (post.views||0) + 1;
    post.views = newViews;
    const el = document.querySelector(`.post[data-id="${id}"] .post-views`);
    if(el) el.textContent = `조회 ${newViews}`;
    await supabase.from('posts').update({ views:newViews }).eq('id', id);
  }

  function setCategory(cat, el){
    currentCat = cat;
    document.querySelectorAll('#catnav button').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    renderPosts();
  }

  document.getElementById('searchInput').addEventListener('keyup', renderPosts);

  // ===== 로그인 상태에 따라 상단 메뉴 표시 =====
  async function updateAuthNav(){
    const { data:{ session } } = await supabase.auth.getSession();
    const link = document.getElementById('navAuthLink');
    if(session){
      link.textContent = '블로그 관리';
      link.classList.add('btn-manage');
    } else {
      link.textContent = '로그인';
      link.classList.remove('btn-manage');
    }
  }

  // ===== 최근 5일 방문자 그래프 =====
  async function loadVisits(){
    // 오늘 방문 1회만 기록 (localStorage로 중복 방지)
    const todayKey = new Date().toISOString().slice(0,10);
    if(localStorage.getItem('lastVisitLogged') !== todayKey){
      await supabase.from('visits').insert({});
      localStorage.setItem('lastVisitLogged', todayKey);
    }

    const { data, error } = await supabase.rpc('get_recent_visits', { days_back: 5 });
    const box = document.getElementById('visitBars');
    if(error || !data){
      box.innerHTML = `<span style="font-size:11px;color:var(--muted)">방문 기록을 불러올 수 없습니다.</span>`;
      return;
    }

    // 최근 5일 전체 날짜를 채우고 없는 날은 0으로 표시
    const days = [];
    for(let i=4;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const key = d.toISOString().slice(0,10);
      const found = data.find(v=>v.visit_date===key);
      days.push({ key, count: found ? Number(found.visit_count) : 0, date:d });
    }
    const max = Math.max(1, ...days.map(d=>d.count));

    box.innerHTML = days.map(d=>{
      const h = Math.max(4, Math.round((d.count/max)*54));
      const lbl = `${d.date.getMonth()+1}/${d.date.getDate()}`;
      return `
        <div class="visit-bar-col">
          <span class="num">${d.count}</span>
          <div class="visit-bar" style="height:${h}px"></div>
          <span class="lbl">${lbl}</span>
        </div>
      `;
    }).join('');

    document.getElementById('todayVisit').textContent = days[days.length-1].count;
    document.getElementById('totalVisit').textContent = days.reduce((a,d)=>a+d.count,0);
  }

  loadPosts();
  loadVisits();
  updateAuthNav();
</script>

</body>
</html>
