<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태그 — 관's Log</title>
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://toonyoo2-spec.github.io/blog/tags.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --paper:#F6F2EA; --paper-2:#EFE9DB; --paper-3:#E6DFCE;
    --ink:#211D18; --muted:#8B8377; --line:#DDD5C6;
    --accent:#2B4C7E; --it:#2B4C7E; --car:#A23E24; --food:#5C7A3D;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .utilitybar{background:var(--ink);color:var(--paper);}
  .utilitybar-inner{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:38px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .utilitybar ul{list-style:none;display:flex;gap:18px;margin:0;padding:0;}
  .utilitybar a{opacity:.78;transition:opacity .15s;}
  .utilitybar a:hover{opacity:1;}

  .wrap{max-width:1080px;margin:0 auto;padding:48px 24px 80px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:32px;margin:0 0 8px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 36px;}

  .cloud{display:flex;flex-wrap:wrap;gap:12px;}
  .tag-card{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;border:1px solid var(--line);background:var(--paper-2);
    border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;
    transition:.15s;
  }
  .tag-card:hover{border-color:var(--ink);background:var(--paper);}
  .tag-card .count{color:var(--muted);font-size:11.5px;}
  .loading, .empty{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:20px 0;}
</style>
</head>
<body>

<nav class="utilitybar" aria-label="블로그 관리 메뉴">
  <div class="utilitybar-inner">
    <ul>
      <li><a href="/index.html">← 목록으로</a></li>
      <li><a href="/write.html">글쓰기</a></li>
      <li><a href="/stats.html">통계</a></li>
    </ul>
  </div>
</nav>

<div class="wrap">
  <h1>태그</h1>
  <p class="sub">글에 달린 태그를 모아봤습니다. 클릭하면 해당 태그 글만 모아볼 수 있어요.</p>
  <div class="cloud" id="cloud"><p class="loading">불러오는 중...</p></div>
</div>

<script>
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  async function loadTags(){
    const { data, error } = await supabase.from('posts').select('tags');
    const box = document.getElementById('cloud');
    if(error){
      box.innerHTML = `<p class="empty">태그를 불러오지 못했습니다.</p>`;
      return;
    }
    const counts = {};
    (data||[]).forEach(p=>{
      (p.tags||[]).forEach(t=>{ counts[t] = (counts[t]||0) + 1; });
    });
    const tags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    if(!tags.length){
      box.innerHTML = `<p class="empty">아직 태그가 달린 글이 없습니다.</p>`;
      return;
    }
    box.innerHTML = tags.map(t=>`
      <a class="tag-card" href="/index.html?tag=${encodeURIComponent(t)}">
        #${escapeHtml(t)} <span class="count">${counts[t]}</span>
      </a>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadTags();
</script>

</body>
</html>
