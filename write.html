<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 관리 — 관's Log</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --paper:#F6F2EA; --paper-2:#EFE9DB; --paper-3:#E6DFCE;
    --ink:#211D18; --muted:#8B8377; --line:#DDD5C6;
    --accent:#2B4C7E; --it:#2B4C7E; --car:#A23E24; --food:#5C7A3D;
    --danger:#A23E24;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .topbar{
    background:var(--ink);color:var(--paper);
    display:flex;justify-content:space-between;align-items:center;
    padding:0 24px;height:44px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  }
  .topbar a{text-decoration:none;opacity:.8;}
  .topbar a:hover{opacity:1;}
  .topbar button{
    background:transparent;border:1px solid rgba(246,242,234,.35);color:var(--paper);
    padding:5px 12px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;
  }
  .topbar button:hover{background:var(--paper);color:var(--ink);}

  .wrap{max-width:720px;margin:0 auto;padding:56px 24px 80px;}
  h1{font-family:'Fraunces',serif;font-size:28px;margin:0 0 28px;}

  /* 로그인 폼 */
  .login-box{
    max-width:360px;margin:80px auto;padding:32px;
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
  }
  .login-box h1{font-size:22px;margin-bottom:20px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .field input, .field textarea, .field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{min-height:220px;line-height:1.6;resize:vertical;font-family:'Inter',sans-serif;}
  .btn{
    width:100%;padding:11px;border:none;border-radius:2px;background:var(--ink);color:var(--paper);
    font-weight:600;font-size:14px;cursor:pointer;
  }
  .btn:hover{background:var(--accent);}
  .error-msg{color:var(--danger);font-size:12.5px;margin-top:10px;font-family:'IBM Plex Mono',monospace;display:none;}

  /* 에디터 */
  .editor-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px;margin-bottom:36px;
  }
  .editor-card h2{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 16px;}
  .row{display:flex;gap:12px;}
  .row .field{flex:1;}
  .editor-actions{display:flex;gap:10px;margin-top:6px;}
  .editor-actions button{flex:1;padding:11px;border:none;border-radius:2px;font-weight:600;font-size:14px;cursor:pointer;}
  .btn-save{background:var(--ink);color:var(--paper);}
  .btn-save:hover{background:var(--accent);}
  .btn-cancel{background:transparent;border:1px solid var(--line) !important;color:var(--muted);}
  .btn-cancel:hover{border-color:var(--ink) !important;color:var(--ink);}
  .save-msg{font-size:12.5px;color:var(--accent);margin-top:10px;font-family:'IBM Plex Mono',monospace;display:none;}

  /* 글 목록 (관리용) */
  .manage-list{display:flex;flex-direction:column;}
  .manage-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .manage-row .info{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .manage-row .title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-row .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .manage-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .manage-row .actions button{
    padding:6px 12px;border-radius:2px;border:1px solid var(--line);background:var(--paper);
    font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .manage-row .actions button:hover{border-color:var(--ink);}
  .manage-row .actions .del{color:var(--danger);}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;color:#fff;margin-right:6px;}
  .chip.IT{background:var(--it);}
  .chip.CAR{background:var(--car);}
  .chip.맛집{background:var(--food);}

  .loading{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:20px 0;}

  #appSection{display:none;}
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html">← 블로그로 돌아가기</a>
  <button onclick="logout()" id="logoutBtn" style="display:none;">로그아웃</button>
</div>

<div class="wrap">

  <!-- 로그인 폼 -->
  <div class="login-box" id="loginSection">
    <h1>로그인</h1>
    <div class="field">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" onclick="login()">로그인</button>
    <p class="error-msg" id="loginError">이메일 또는 비밀번호가 올바르지 않습니다.</p>
  </div>

  <!-- 로그인 후 화면 -->
  <div id="appSection">
    <h1 id="editorTitle">새 글 작성</h1>

    <div class="editor-card">
      <h2 id="editorLabel">글쓰기</h2>
      <input type="hidden" id="editId">
      <div class="field">
        <label for="title">제목</label>
        <input id="title" type="text" placeholder="글 제목">
      </div>
      <div class="row">
        <div class="field">
          <label for="category">카테고리</label>
          <select id="category">
            <option value="IT">IT</option>
            <option value="CAR">CAR</option>
            <option value="맛집">맛집</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="content">본문</label>
        <textarea id="content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="editor-actions">
        <button class="btn-save" onclick="savePost()">저장</button>
        <button class="btn-cancel" onclick="resetEditor()" id="cancelBtn" style="display:none;">취소</button>
      </div>
      <p class="save-msg" id="saveMsg">저장되었습니다.</p>
    </div>

    <h1>전체 글 (<span id="postCount">0</span>)</h1>
    <div class="manage-list" id="manageList">
      <p class="loading">불러오는 중...</p>
    </div>
  </div>

</div>

<script>
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  let posts = [];

  async function checkSession(){
    const { data:{ session } } = await supabase.auth.getSession();
    if(session){
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('appSection').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      loadPosts();
    } else {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('appSection').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
    }
  }

  async function login(){
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){
      document.getElementById('loginError').style.display = 'block';
    } else {
      document.getElementById('loginError').style.display = 'none';
      checkSession();
    }
  }

  async function logout(){
    await supabase.auth.signOut();
    checkSession();
  }

  async function loadPosts(){
    const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending:false });
    if(error){
      document.getElementById('manageList').innerHTML = `<p class="loading">글을 불러오지 못했습니다.</p>`;
      return;
    }
    posts = data || [];
    renderManageList();
  }

  function renderManageList(){
    document.getElementById('postCount').textContent = posts.length;
    const list = document.getElementById('manageList');
    if(!posts.length){
      list.innerHTML = `<p class="loading">작성된 글이 없습니다.</p>`;
      return;
    }
    list.innerHTML = posts.map(p=>{
      const d = new Date(p.created_at);
      const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      return `
        <div class="manage-row">
          <div class="info">
            <div class="title"><span class="chip ${p.category}">${p.category}</span>${escapeHtml(p.title)}</div>
            <div class="meta">${dateStr} · 조회 ${p.views}</div>
          </div>
          <div class="actions">
            <button onclick="editPost('${p.id}')">수정</button>
            <button class="del" onclick="deletePost('${p.id}')">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function editPost(id){
    const p = posts.find(x=>x.id===id);
    if(!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('title').value = p.title;
    document.getElementById('category').value = p.category;
    document.getElementById('content').value = p.content;
    document.getElementById('editorLabel').textContent = '글 수정';
    document.getElementById('editorTitle').textContent = '글 수정';
    document.getElementById('cancelBtn').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function resetEditor(){
    document.getElementById('editId').value = '';
    document.getElementById('title').value = '';
    document.getElementById('category').value = 'IT';
    document.getElementById('content').value = '';
    document.getElementById('editorLabel').textContent = '글쓰기';
    document.getElementById('editorTitle').textContent = '새 글 작성';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  async function savePost(){
    const id = document.getElementById('editId').value;
    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const content = document.getElementById('content').value.trim();

    if(!title || !content){
      alert('제목과 본문을 입력해주세요.');
      return;
    }

    let error;
    if(id){
      ({ error } = await supabase.from('posts').update({ title, category, content }).eq('id', id));
    } else {
      ({ error } = await supabase.from('posts').insert({ title, category, content }));
    }

    if(error){
      alert('저장에 실패했습니다: ' + error.message);
      return;
    }

    const msg = document.getElementById('saveMsg');
    msg.style.display = 'block';
    setTimeout(()=>{ msg.style.display = 'none'; }, 2000);

    resetEditor();
    loadPosts();
  }

  async function deletePost(id){
    if(!confirm('이 글을 삭제할까요? 되돌릴 수 없습니다.')) return;
    const { error } = await supabase.from('posts').delete().eq('id', id);
    if(error){
      alert('삭제에 실패했습니다: ' + error.message);
      return;
    }
    loadPosts();
  }

  checkSession();
</script>

</body>
</html>
